name: Daily TVBox Sources Pipeline

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动定时运行
    - cron: '0 20 * * *'
    # 每天北京时间中午 12:00 (UTC 04:00) 再次定时保鲜
    - cron: '0 4 * * *'
  workflow_dispatch: # 支持在 GitHub 网页端 Actions 页面手动点击运行

concurrency:
  group: tvbox-update
  cancel-in-progress: true

jobs:
  update-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.12 环境 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装运行依赖 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 拉取上游源并执行保鲜质检 (Fetch & Auto Repair)
        run: |
          python fetch_sources.py

      - name: 执行特征打标与 6 梯队优化重排 (Test & Fix Pipeline)
        run: |
          python test_and_fix.py

      - name: 提交并推送最新数据 (Commit & Push Changes)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(auto): daily update and refresh TVBox sources [skip ci]"
            git push origin main
          else
            echo "所有源数据未发生变动，跳过本次推送。"
          fi
